<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GRID</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(251, 233, 208);
        text-align: center;
        margin: auto;
        width: 100%;
        height: 100%;
    }
    .gallery{
        display: grid;
        padding: 20px;
        margin: 0 auto;
        gap: 20px; 
        grid-template-columns: repeat(8, 1fr); /* 4 images per row */
        max-width: 100%; 
        box-sizing: border-box;
    }
    img{
        width: 100%; 
        height: auto; 
    }
</style>
<body>
    <p>My Gallery</p>
    
    <div class="gallery">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
        <img src="./images/pexels-arist-creathrive-2253573.jpg" alt="">
    </div>
</body>
</html>
