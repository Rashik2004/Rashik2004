<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLogin</title>
    <link rel="stylesheet" href="./instaLogin.css">
<!-- font for page -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<!-- font for page -->
</head>
<body>
    <div class="outbox">
        <div class="form">
          <form action="">
            <p class="heading-insta">Instagram</p>
            <input type="text" placeholder="Phone number, username, or email" class="label"> <br>
            <input type="password" placeholder="Password" autocomplete="current-password"
            required=""
            id="id_password" class="label">
            <br>
            <button type="submit" id="login-button">Log In</button> <br>

            <div class="or-container">
                <div class="or-line"></div>
                <span>OR</span>
                <div class="or-line"></div>
            </div>

            <br>
            <a href="https://www.facebook.com/"><p class="logfb"><img src="./images/Facebook_Logo_Primary.png" alt="" class="logo"> &nbsp;Log in with Facebook</p></a>
            <br>
          </form>  
        </div>
        
        <div class="signup">
        Don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/">Sign up</a>
        </div> 
        <div class="getapp">
            <p>Get the app.</p>
            <a href="https://apps.apple.com/us/app/instagram/id389801252">
                <img src="./images/applestorelabel.png" alt="" class="icon">
            </a>
            &nbsp;
            <a href="https://play.google.com/store/apps/details?id=com.instagram.android&hl=en-us">
                <img src="./images/googleplaylabel.png" alt="" class="icon">
            </a>
        </div>
    </div>
</body>
</html>
