<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery effects</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <div id="container" class="flex flex-wrap gap-2">
        <div class="box w-24 h-24 bg-red-500"></div>
        <div class="box w-24 h-24 bg-blue-500"></div>
        <div class="box w-24 h-24 bg-green-500"></div>
        <div class="box w-24 h-24 bg-yellow-500"></div>
    </div>

    <button id="toggleEffect">Toggle Effects</button>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#toggleEffect").click(function () {
                $(".box").each(function (index, element) {
                    $(element)
                        .fadeOut(500)
                        .fadeIn(500)
                        .slideUp(500)
                        .slideDown(500)
                        .animate({ opacity: 0.5, width: "50px", height: "50px" }, 500)
                        .animate({ opacity: 1, width: "96px", height: "96px" }, 500)
                        .hide(500)
                        .show(500);
                });
            });
        });
    </script>
</body>
</html>
