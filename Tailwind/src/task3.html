<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-3</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="m-10px">
    <div>
        <div class="w-100% bg-orange-400 h-fit">
            <h1 class="text-3xl text-center p-7 m-4">Addmission Information</h1>
        </div>
        <div class="flex ml-4 mr-4">
            <div class=" w-40% m-3">
                <img src="./images/laptop-8499942_1280.jpg" alt="">
            </div>
            <div class=" w-40% m-3">
                <img src="./images/laptop-8499942_1280.jpg" alt="">
            </div>
        </div>
        <div class="w-100% bg-orange-400 h-fit m-3">
            <span class="text-1xl p-4 text-center flex justify-center"><a href="#">VIST OUT SITE</a></span>
        </div>
        <div>
            <div class=" justify-center ml-3 mr-3 mb-3 h-fit p-10px  border-1 border-b-blue-900 text-center mb-30px rounded-2xl p-2">
                <div class=" container mx-auto bg-purple-200">
                    <h1 class=" text-3xl font-bold text-center mb-8 pt-4">Tailwind CSS Form Example</h1>
                    <!-- Form  with the help of tailwind-->
                    <form action="" class=" bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto pb-4">
                        <div class=" mb-4">
                            <label for="name" class=" block text-sm font-medium text-gray-700 mb-2">Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter your name" class=" w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class=" mb-4" >
                            <label for="email" class=" block text-sm font-medium text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" class=" w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class=" mb-4" >
                            <label for="password" class=" block text-sm font-medium text-gray-700 mb-2">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password" class=" w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class=" mb-4" >
                            <label for="message" class=" block text-sm font-medium text-gray-700 mb-2">message</label>
                            <textarea name="message" id="message" placeholder="Enter your message" class=" w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                        <div class=" flex items-center mb-4">
                            <input type="checkbox" id="terms" name="terms" class="mr-2">
                            <label for="terms" class=" block text-sm font-medium text-gray-700 mb-2">&nbsp; I agree to the terms and conditions.</label>
                        </div>
                        <button class=" border-0 bg-purple-200 pt-1 pb-1 pl-3 pr-3  rounded-2xl hover:bg-purple-950 transition ease-in-out hover:text-white" type="submit" >Submit</button>
                    </form>
                </div>
    </div>
</body>
</html>
