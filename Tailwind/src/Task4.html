<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>properties Tailwind</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <div class=" block text-red-500">This is another division</div>
    <div class="flex">This is a new flex.</div>
    <div class="grid ">This is a new grid.</div>
    <div class="visible">This should be visible.</div>
    <div class="invisible">This should not be visible.</div>
    <img src="./images/WhatsApp Image 2025-01-20 at 11.47.11.jpeg" alt="" class="float-right w-32 h-32 mr-5 rounded-2xl">
    <div class=" clear-both"></div>
    <div class=" box-border w-64 h-32 p-4 border-2 ml-4">This is an border</div>
    <div class=" z-3 bg-red-500 p-4">I am above</div>
    <div class="m-8">
        <!-- Blue circle(behind) -->
         <div class=" absolute w-40 h-40 bg-red-500 rounded-full top-130 left-20 "></div>
         <!-- Blue circle(behind) -->
         <div class=" absolute w-40 h-40 bg-blue-300 rounded-full top-130 left-40 "></div>
    </div>
    <div class ="grid grid-cols-3 gap-4 h-80 w-full mt-90">
        <div class=" bg-blue-500 p-4">1</div>
        <div class=" bg-blue-500 p-4">2</div>
        <div class=" bg-blue-500 p-4">3</div>
    </div>
    <div class="grid grid-rows-3 gap-2 mt-20">
        <div class=" bg-blue-500 p-4">1</div>
        <div class=" bg-blue-500 p-4">2</div>
        <div class=" bg-blue-500 p-4">3</div>
    </div>


    <div class="w-64 h-64 border-4">
        <img src="./images/WhatsApp Image 2025-01-20 at 11.47.11.jpeg" alt="example img" class="object-contain w-full h-full object-top">
    </div>
    <div class="w-64 h-64 border-4">
        <img src="./images/WhatsApp Image 2025-01-20 at 11.47.11.jpeg" alt="example img" class="object-cover w-full h-full object-top">
    </div>
    <div class="w-64 h-64 border-2">
        <img src="./images/WhatsApp Image 2025-01-20 at 11.47.11.jpeg" alt="example img" class="object-fill w-full h-full object-top">
    </div>
    <div class="w-64 h-64 border-2">
        <img src="./images/WhatsApp Image 2025-01-20 at 11.47.11.jpeg" alt="example img" class="object-none w-full h-full object-top">
    </div>
    <div class="w-64 h-64 border-2">
        <img src="./images/WhatsApp Image 2025-01-20 at 11.47.11.jpeg" alt="example img" class="object-scale-down w-full h-full object-top">
    </div>
</body>
</html>
