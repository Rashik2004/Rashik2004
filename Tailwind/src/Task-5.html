<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-blue-600 p-4 text-center text-xl font-bold text-white">Travel Agency</header>

    <!-- Grid Layout -->
    <div class="place-items-center justify-between">
      <div class="grid grid-cols-3 gap-4 p-4">
        <img src="./images/mountains-7292778_1280.jpg" alt="img1" class="w-full" />
        <img src="./images/losangeles-7754986_1280.jpg" alt="img2" class="w-full" />
        <img src="./images/autumn-7493439_1280.jpg" alt="img3" class="w-full" />
      </div>
    </div>

    <!-- Container 1 -->
    <div class="flex justify-around p-4 gap-2">
      <div class="bg-white p-4 shadow-md">
        <img src="./images/frog-9335937_1280.jpg" alt="img4" class="w-full" />
        <div class="mt-2 text-center">Description</div>
      </div>

      <!-- Container 2 -->
      <div class="bg-white p-4 shadow-md">
        <img src="./images/lily-8157895_1280.jpg" alt="img5" class="w-full" />
        <div class="mt-2 text-center">Description</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 p-3 text-center text-white sticky bottom-0">© 2025 Travel Agency. All Rights Reserved.</footer>
  </body>
</html>
