    <!-- create a text area and count the number of words in the text area -->

    <input type="textarea" id="text" placeholder="Enter Text" oninput="count()">
    <br>
    <p id="result">Word Count: <span id="words">0</span></p>
    <script>
        function count(){
            var str = document.getElementById("text").value;
            var words = str.split(" ");
            document.getElementById("result").innerText = words.length;
        }
    </script>
