<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript function</title>
</head>
<body>
    <input type="text" id="input1" placeholder="Enter your name">
    <p>You are Typing:  <span id="output"></span></p>
    <p id="demo"></p>

    <!-- Onchnage criteria for idselectors -->
<label for="colorSelect">Choose a color:</label>
<select id="colorSelect">
    <option value="Red">Red</option>
    <option value="Green">Green</option>
    <option value="Blue">Blue</option>
</select>
<p>Selected Color: <span id="selectedColor"></span></p>

    <script>
        document.getElementById("input1").oninput = function() {
            document.getElementById("output").innerText=this.value;
        }
        document.getElementById("colorSelect").onchange = function() {
            document.getElementById("selectedColor").innerText= this.value;
        }
    </script>
    <br>
</body>
</html>
