<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body id="body" class="text-center space-y-6">
    <h1 id="heading" class="text-center text-4xl font-bold font-stretch-140%">Hello world</h1>
    <p id="content" class="text-center font-stretch-90% text-2xl">This is a paragraph</p>
    <a id="link" href="#" class="text-center block">click me</a>
    <div class="w-full flex justify-center">
        <div id="box" class="text-center border-2 flex justify-center w-1/2">
            <span>This is a box</span>
        </div>
    </div>
    <div class="w-full flex justify-center">
        <button id="btn" class="border-2 rounded-2xl w-1/3">Change color</button>
    </div>
    <script>
        var heading = document.getElementById("heading");
        var content = document.getElementById("content");
        var link = document.getElementById("link");
        var box = document.getElementById("box");
        var btn = document.getElementById("btn");
        var body = document.getElementById("body");
        let randcolor = Math.floor(Math.random()*16777215).toString(16);
        let randcolor2 = Math.floor(Math.random()*16777215).toString(16);
        box.style.color = "#"+randcolor2;
        box.style.backgroundColor = "#" + randcolor;
        box.style.padding = "20px";
        box.style.margin = "20px";
        link.addEventListener("click", function(){
            body.style.backgroundColor = "#223843";
            heading.style.color = "#D8B4A0";
            body.style.color = "#EFF1F3";
        });

        box.addEventListener("dblclick", function(){
            alert("Box double clicked");
        });

        btn.addEventListener("click", function(){
            box.style.backgroundColor = "#E3D26F";
            heading.style.color = "#CA895F";
            content.style.fontSize = "30px";
            body.style.backgroundColor = "#2F1B25";
            body.style.color = "#A15E49";
          });
    </script>
</body>
</html>
